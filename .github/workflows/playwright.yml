
name: e2e

on:
  push:
  pull_request:

jobs:
  # ========================================================
  # 1) PLAYWRIGHT TESTS (HTML + Allure)
  # ========================================================
  playwright-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers & OS dependencies
        run: npx playwright install --with-deps

      - name: Run Playwright tests (Allure + HTML reporters)
        env:
          CI: true
        run: |
          xvfb-run --auto-servernum -- npx playwright test --reporter=line,allure-playwright,html

      - name: Generate Allure report
        run: |
          npx allure generate --clean ./allure-results --output ./allure-report

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 14

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload Playwright test results (videos/screenshots/traces)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore

  # ========================================================
  # 2) CUCUMBER + PLAYWRIGHT TESTS
  # ========================================================
  cucumber-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: playwright-tests       # run after Playwright job

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Cucumber tests
        run: npx cucumber-js --parallel 4

      - name: Upload Cucumber report (JSON/HTML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report
          path: reports/**
          retention-days: 14
